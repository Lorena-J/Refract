# The one place that pins the bundled tools: versions, sources and SHA-256 of
# everything downloaded. Plain KEY=VALUE lines (no quoting, no spaces), so it is
# read by `. packaging/tools.lock` in shell and by scripts/test_packaging.py.
# Read by: scripts/install-tex-tools.sh, scripts/build-tex-seed.sh, scripts/build-tools.sh, scripts/build-synctex.sh,
# scripts/build-git-macos.sh, the Dockerfile and the release workflow.
# Every hash below comes from the upstream release page or file, not from a
# local guess. To bump a tool: change its version and hashes here, nothing else.
# Keys: <TOOL>_SHA256_<os>_<arch> (os: darwin linux windows; arch: amd64 arm64).

# Tectonic: official release assets (musl static on Linux, MSVC static CRT on Windows).
# Upstream publishes no Windows arm64 build: windows-arm64 is a documented gap.
TECTONIC_VERSION=0.17.0
TECTONIC_SHA256_darwin_arm64=a3f1cac7c5678f01661a92212f58480ae3b0634115d880dbc59e2953ded45667
TECTONIC_SHA256_darwin_amd64=7c90ef5b6ddb1eb1937e4337add5237b79338e4b9676459fa91187d24d6cdf80
TECTONIC_SHA256_linux_arm64=b10954a95404f3ab2328d2fa59a5ebab8e657f893fab096f98be8db7c0c979b8
TECTONIC_SHA256_linux_amd64=8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7
TECTONIC_SHA256_windows_amd64=f61ce51f0b0ade1015b7de7ef368541c5424e9756ecbd0d7af97d6d48030845f
