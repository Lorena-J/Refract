# synctex CLI: built from the official parser sources (Tectonic ships none).
# Tag 2023.4(TeXLive); the commit hash pins the content.
SYNCTEX_REPO=https://github.com/jlaurens/synctex.git
SYNCTEX_COMMIT=c3641da45b41cd61f9e625fe722d0a8d54cedaa9

