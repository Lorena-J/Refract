    <!-- Front plane. The open space between the two contours is deliberate. -->
    <path d="M 24.2 45.7 C 23.6 44.6 24 43.1 25.4 41.3 C 30.5 34.6 40.5 27.1 47.1 24 C 49.7 22.7 52 24.4 52 27.4 L 52 54.1 C 52 57.1 50.3 58.1 47.7 57 L 26.1 48.1 C 24.8 47.6 24.3 46.8 24.2 45.7 Z"/>
